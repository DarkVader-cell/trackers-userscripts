name: Release Aither bonus userscript

on:
  push:
    tags:
      - "aither-bonus-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Aither - Bonus Rewards/Aither - Bonus Rewards.user.js
            Aither - Bonus Rewards/readme.md
