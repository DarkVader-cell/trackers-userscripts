name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build --workspace="Find Unique Titles"

      - name: Create GitHub release and upload userscript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Find Unique Titles/dist/find.unique.titles.user.js" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Find Unique Titles $GITHUB_REF_NAME" \
            --generate-notes
